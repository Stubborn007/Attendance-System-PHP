<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jenkins Nginx Deployment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 50px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 42px;
            margin-bottom: 15px;
        }

        h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border-radius: 25px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .info p {
            margin: 8px 0;
            font-size: 16px;
        }

        footer {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🚀</div>

        <h1>Welcome!</h1>

        <h2>Jenkins + Nginx Deployment</h2>

        <div class="status">
            ✓ Deployment Successful
        </div>

        <p>
            This website is running on Nginx and was deployed
            automatically using Jenkins.
        </p>

        <div class="info">
            <p><strong>Server:</strong> Nginx</p>
            <p><strong>CI/CD:</strong> Jenkins</p>
            <p><strong>Status:</strong> Online</p>
        </div>

        <footer>
            DevOps Project 🚀 | Jenkins CI/CD Pipeline
        </footer>

    </div>

</body>
</html>
